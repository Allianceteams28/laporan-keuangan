<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101D40">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Laporan Keuangan Tim</title>
<style>
  :root{
    --paper:#F2F5FA; --card:#FFFFFF; --navy:#101D40; --ink:#17233F; --muted:#78849A; --line:#E1E7F0;
    --mint:#52E3B1; --coral:#FF8F91;
    --in:#52E3B1; --out:#FF8F91; --accent:#52E3B1;
    --in-bg:#E3FAF1; --out-bg:#FFEDED; --in-ink:#0B7D5B; --out-ink:#C2484D;
    --warn:#8A5D00; --warn-bg:#FFF4D6; --amber:#F4C95D;
  }
  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:smooth}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);line-height:1.45}
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px 150px}
  h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
  h2{font-size:15px;margin:22px 0 10px}
  select,input,textarea{font:inherit;color:inherit}

  /* ---------- Header utama ---------- */
  header.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
  header.top .in{max-width:520px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
  header.top img{flex:none}
  header.top .ttl{flex:1;min-width:0}
  header.top h1{color:#fff;font-size:17px}
  .who{font-size:12px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header.top .ghost{background:transparent;border-color:rgba(255,255,255,.3);color:#fff;padding:6px 11px;font-size:13px}
  header.top .badge{background:var(--coral);color:#3A1114}

  .pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--line);color:var(--ink)}
  .pill.founder{background:var(--mint);color:var(--navy)}
  .pill.admin{background:#fff;color:var(--navy)}
  .pill.member{background:rgba(255,255,255,.16);color:#fff}
  .wrap .pill.member{background:var(--line);color:var(--ink)}
  .pill.pending,.pill.open{background:var(--warn-bg);color:var(--warn)}
  .pill.removed{background:var(--out-bg);color:var(--out-ink)}
  .pill.fixed{background:var(--in-bg);color:var(--in-ink)}
  .pill.admin_fixed{background:#E2E8F7;color:var(--navy)}
  .wrap .pill.admin{background:#E2E8F7;color:var(--navy)}
  .wrap .pill.founder{background:var(--navy);color:#fff}

  /* ---------- Tombol ---------- */
  button{font:inherit;color:inherit}
  .ghost{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
  .ghost.small,.small{padding:7px 12px;border-radius:9px;font-size:13px}
  .btn{border:0;border-radius:12px;padding:13px 20px;font-weight:600;font-size:15px;cursor:pointer;background:var(--navy);color:#fff}
  .btn.small{padding:8px 14px}
  .btn.light{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .fab{position:fixed;right:max(16px,calc(50% - 244px));background:var(--navy);color:#fff;border:0;border-radius:28px;padding:14px 22px;font-weight:600;font-size:15px;box-shadow:0 8px 20px rgba(16,29,64,.3);cursor:pointer}
  .month{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px}

  /* ---------- Kartu saldo ---------- */
  .balance{background:var(--navy);color:#fff;border-radius:18px;padding:20px}
  .balance small{opacity:.72;font-size:13px}
  .balance .big{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:2px 0 14px;font-variant-numeric:tabular-nums}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .split > *{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;border:0;text-align:left;color:#fff}
  .split button{cursor:pointer}
  .split b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
  .split em{display:block;font-style:normal;font-size:11px;opacity:.65;margin-top:2px}
  .split .i b{color:var(--mint)}.split .o b{color:var(--coral)}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 10px;text-align:left;cursor:pointer;min-width:0}
  .tile .dt{display:block;width:9px;height:9px;border-radius:50%;margin-bottom:6px}
  .tile small{display:block;font-size:12px;color:var(--muted)}
  .tile b{display:block;font-size:14px;font-variant-numeric:tabular-nums;word-break:break-word}
  .bignum{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

  /* ---------- Transaksi ---------- */
  .day{font-size:13px;color:var(--muted);margin:16px 0 6px}
  .txc{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
  .tx{display:flex;align-items:center;gap:12px;padding:11px 12px}
  .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
  .tx.in .dot{background:var(--mint);color:var(--navy)}
  .tx.out .dot{background:var(--coral);color:#3A1114}
  .tx.asset .dot{background:#DCE4F4;color:var(--navy)}
  .tx.debt .dot{background:#FFD6D7;color:#3A1114}
  .tx .t{flex:1;min-width:0}
  .tx .t b{display:block;font-size:15px;font-weight:600}
  .tx .t span{font-size:13px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .amt{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;padding:3px 9px;border-radius:8px;white-space:nowrap}
  .in .amt{background:var(--mint);color:var(--navy)}
  .out .amt{background:var(--coral);color:#3A1114}
  .asset .amt,.debt .amt{background:var(--paper);color:var(--navy);border:1px solid var(--line)}
  .extra{border-top:1px solid var(--line);padding:10px 12px;font-size:13px;background:#FAFBFE;display:grid;gap:4px}
  .extra .late{color:var(--out-ink);font-weight:600}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .empty{text-align:center;color:var(--muted);padding:30px 12px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .muted{color:var(--muted)}
  .center{min-height:80vh;display:grid;place-content:center;justify-items:center;text-align:center;gap:14px;padding:24px}
  .center p{color:var(--muted);max-width:300px;margin:auto}
  .login-logo{border-radius:24px;box-shadow:0 10px 30px rgba(16,29,64,.18)}

  /* ---------- Navigasi bawah ---------- */
  nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
  nav.bar .in{display:flex;width:100%;max-width:520px}
  nav.bar button{flex:1;border:0;background:none;padding:14px 4px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
  nav.bar button.on{color:var(--navy);border-top-color:var(--mint);font-weight:700}
  .weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .weeknav b{font-size:15px}
  .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--coral);color:#3A1114;font-size:11px;line-height:18px;text-align:center;font-weight:700}

  /* ---------- Grafik batang (admin) ---------- */
  .chart .row{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:7px 0;cursor:pointer;text-align:left;font:inherit;color:inherit}
  .chart .lab{width:104px;flex:none;font-size:14px}
  .chart .track{flex:1;height:22px;background:var(--paper);border-radius:6px;overflow:hidden}
  .chart .track i{display:block;height:100%;border-radius:6px}
  .chart.out .track i{background:var(--coral)}.chart.in .track i{background:var(--mint)}
  .chart .val{width:96px;flex:none;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}

  /* ---------- Doughnut & analisis ---------- */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);white-space:nowrap}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .donut{position:relative;max-width:260px;margin:4px auto 8px}
  .donut svg{display:block;width:100%;height:auto;overflow:visible}
  .seg-c{cursor:pointer;transition:stroke-width .25s ease,opacity .25s ease}
  .seg-c:focus-visible{outline:none;stroke:var(--navy)}
  .lg{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 8px;border-radius:10px;cursor:pointer;text-align:left;font:inherit;color:inherit}
  .lg.on{background:var(--paper)}
  .lg i{width:12px;height:12px;border-radius:4px;flex:none}
  .lg .n{flex:1;min-width:0;font-size:14px}
  .lg .v{font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
  .lg .p{width:42px;text-align:right;font-size:12px;color:var(--muted)}
  .alert{border-left:4px solid var(--coral);background:#FFF3F3;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:8px}
  .alert.warn{border-color:var(--amber);background:#FFF8E5}
  .alert.ok{border-color:var(--mint);background:#EEFCF6}
  .alert.info{border-color:#9FB4D9;background:#F1F5FC}
  .alert b{font-weight:700}
  .cn{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .cn:last-of-type{border-bottom:0}
  .cn i{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--mint)}
  .cn.warn i{background:var(--amber)}.cn.bad i{background:var(--coral)}
  .verdict{border-radius:14px;padding:14px;font-size:15px;font-weight:600;margin-bottom:10px;background:var(--in-bg);border:1px solid var(--mint);color:var(--navy)}
  .verdict.bad{background:var(--out-bg);border-color:var(--coral)}
  .pb{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 4px}
  .pb i{display:block;height:100%;border-radius:6px;background:var(--mint)}
  .pb.near i{background:var(--amber)}.pb.over i{background:var(--coral)}
  .bud{padding:10px 0;border-bottom:1px solid var(--line)}
  .bud:last-child{border-bottom:0}
  .bud .r{display:flex;justify-content:space-between;gap:8px;font-size:14px}
  .bud small{color:var(--muted);font-size:12px}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--mint);color:var(--navy)}
  .tag.near{background:var(--amber)}.tag.over{background:var(--coral);color:#3A1114}

  /* ---------- Daftar anggota, riwayat, notifikasi ---------- */
  .person{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .person:last-child{border:0}
  .person img,.person .av{width:38px;height:38px;border-radius:50%;background:var(--line);flex:none;object-fit:cover;display:grid;place-items:center;font-weight:700;color:var(--muted)}
  .person .t{flex:1;min-width:0}.person .t b{display:block;font-size:15px}
  .person .t span{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis}
  .hist{border-left:3px solid var(--line);padding:2px 0 10px 12px;margin-left:4px;font-size:14px}
  .hist .hd{font-size:12px;color:var(--muted)}
  .hist .rs{color:var(--muted);font-style:italic}
  .hist .df{font-size:13px;margin-top:2px}
  .notif{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .notif.new{border-color:var(--mint);background:#F1FDF8}
  .notif b{display:block}.notif span{font-size:12px;color:var(--muted)}
  .menu{display:grid;gap:10px}
  .menu button{text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:16px;font-weight:600;cursor:pointer;color:var(--ink)}

  /* ---------- Formulir & jendela ---------- */
  dialog{border:0;border-radius:20px 20px 0 0;width:100%;max-width:520px;margin:auto auto 0;padding:20px;background:var(--card);color:var(--ink);max-height:92vh;overflow:auto}
  dialog::backdrop{background:rgba(16,29,64,.5)}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--paper);border-radius:12px;padding:4px;margin:12px 0}
  .seg button{border:0;background:none;padding:10px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;font-size:14px}
  .seg button.on.in{background:var(--mint);color:var(--navy)}
  .seg button.on.out{background:var(--coral);color:#3A1114}
  .seg button.on.asset{background:var(--navy);color:#fff}
  .seg button.on.debt{background:#FFD6D7;color:#3A1114}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  .f{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;font-size:16px}
  .f:focus,button:focus-visible,select:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
  .f:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(16,29,64,.1)}
  .amount{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  textarea.f{resize:vertical;font-family:inherit}
  .actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:18px}
  .err{color:var(--out-ink);font-size:13px;min-height:18px;margin-top:8px}
  #toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-8px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;max-width:90%;text-align:center;z-index:50}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- Layar muat: titik mengetik + shimmer ---------- */
  .splash{min-height:100vh;background:var(--navy);color:#fff;display:grid;place-content:center;justify-items:center;gap:18px;text-align:center}
  .splash img{border-radius:24px;animation:pop .6s cubic-bezier(.2,.8,.2,1) both}
  .splash .st{font-size:18px;font-weight:700;letter-spacing:-.01em;animation:rise .5s .15s both}
  .dots{display:flex;gap:8px;height:14px;align-items:center}
  .dots span{width:9px;height:9px;border-radius:50%;background:var(--mint);animation:typing 1.2s infinite ease-in-out}
  .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
  .sk{background:linear-gradient(100deg,#E6ECF5 30%,#F8FAFD 50%,#E6ECF5 70%);background-size:300% 100%;animation:shimmer 1.4s linear infinite;border-radius:14px}
  .sk.line{height:14px;border-radius:8px}
  .sk-row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}

  /* ---------- Transisi lembut ---------- */
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes sheetUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
  @keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-7px);opacity:1}}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
  @keyframes dash{from{stroke-dasharray:0 600}}
  .enter > *{animation:rise .38s cubic-bezier(.2,.7,.2,1) both}
  .enter > *:nth-child(2){animation-delay:.04s}.enter > *:nth-child(3){animation-delay:.08s}
  .enter > *:nth-child(4){animation-delay:.12s}.enter > *:nth-child(5){animation-delay:.16s}
  .enter > *:nth-child(n+6){animation-delay:.2s}
  .enter .txc,.enter .notif,.enter .person{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
  .enter .chart .track i{transform-origin:left center;animation:grow .7s cubic-bezier(.2,.7,.2,1) both .18s}
  .enter .pb i{transform-origin:left center;animation:grow .7s cubic-bezier(.2,.7,.2,1) both .2s}
  .enter .seg-c{animation:dash .9s cubic-bezier(.2,.7,.2,1) both}
  button,select,input,textarea{transition:transform .14s ease,background-color .22s ease,border-color .22s ease,color .22s ease,box-shadow .22s ease,opacity .22s ease}
  button:active:not(:disabled){transform:scale(.97)}
  button:disabled{opacity:.5}
  .fab:active{transform:scale(.96)}
  nav.bar button{transition:color .22s ease,border-top-color .22s ease}
  dialog[open]{animation:sheetUp .3s cubic-bezier(.2,.8,.2,1)}
  dialog[open]::backdrop{animation:fade .25s ease}
  .badge{animation:fade .3s ease}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<div id="app"><div class="splash"><img src="logo.png" alt="" width="88" height="88"><div class="st">Laporan Keuangan</div><div class="dots" role="status" aria-label="Memuat"><span></span><span></span><span></span></div></div></div>

<dialog id="dlg">
  <h2 style="margin:0">Buat laporan</h2>
  <div class="seg" id="seg">
    <button type="button" data-t="in">Pemasukan</button>
    <button type="button" data-t="out" class="on out">Pengeluaran</button>
    <button type="button" data-t="debt">Utang</button>
    <button type="button" data-t="asset">Aset</button>
  </div>
  <label for="amount">Jumlah (Rp)</label>
  <input class="f amount" id="amount" inputmode="numeric" placeholder="0" autocomplete="off">
  <label for="cat">Kategori</label>
  <select class="f" id="cat"></select>
  <label for="memo">Catatan (opsional)</label>
  <input class="f" id="memo" placeholder="Misal: makan siang" maxlength="80">
  <label for="date">Tanggal</label>
  <input class="f" type="date" id="date">
  <p class="hint" id="typeHint"></p>
  <div class="err" id="err"></div>
  <div class="actions">
    <button type="button" class="btn light" id="cancel">Batal</button>
    <button type="button" class="btn" id="save">Simpan</button>
  </div>
</dialog>

<dialog id="sheet"><div id="sheetBody"></div></dialog>
<div id="toast" role="status"></div>
<script type="module" src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
